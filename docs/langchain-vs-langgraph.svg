<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="langchainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e" />
      <stop offset="100%" style="stop-color:#16a34a" />
    </linearGradient>
    <linearGradient id="langgraphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6" />
      <stop offset="100%" style="stop-color:#7c3aed" />
    </linearGradient>
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#d97706" />
    </linearGradient>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="100%" style="stop-color:#2563eb" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad2)"/>
  
  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="bold">LangChain Agent vs LangGraph Multi-Agent</text>
  
  <!-- Divider Line -->
  <line x1="500" y1="60" x2="500" y2="580" stroke="#4a5568" stroke-width="2" stroke-dasharray="8,4"/>
  
  <!-- ============ LEFT SIDE: LangChain ============ -->
  
  <text x="250" y="75" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="20" font-weight="bold">🔗 LangChain Agent</text>
  <text x="250" y="95" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="11">Single Agent with Tools (Linear Flow)</text>
  
  <!-- LangChain Agent Box -->
  <rect x="100" y="115" width="300" height="200" rx="12" fill="url(#langchainGrad)" filter="url(#shadow2)"/>
  <text x="250" y="145" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">create_agent()</text>
  
  <!-- LLM Box inside -->
  <rect x="120" y="160" width="120" height="50" rx="8" fill="url(#llmGrad)" filter="url(#shadow2)"/>
  <text x="180" y="182" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🧠 LLM Model</text>
  <text x="180" y="198" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="9">Claude / GPT</text>
  
  <!-- System Prompt Box -->
  <rect x="260" y="160" width="120" height="50" rx="8" fill="#374151"/>
  <text x="320" y="182" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📝 System Prompt</text>
  <text x="320" y="198" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="9">Agent instructions</text>
  
  <!-- Tools Box -->
  <rect x="120" y="225" width="260" height="75" rx="8" fill="url(#toolGrad)"/>
  <text x="250" y="248" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🔧 Tools (Functions with @tool decorator)</text>
  <text x="250" y="268" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="10">get_weather() | search_docs() | calculate()</text>
  <text x="250" y="288" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="9">Agent decides which tool to call</text>
  
  <!-- Flow diagram for LangChain -->
  <rect x="130" y="340" width="80" height="35" rx="5" fill="#2d3748" stroke="#4a5568"/>
  <text x="170" y="362" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">User Query</text>
  
  <line x1="210" y1="357" x2="240" y2="357" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <rect x="245" y="340" width="60" height="35" rx="5" fill="#22c55e"/>
  <text x="275" y="362" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Agent</text>
  
  <line x1="305" y1="357" x2="335" y2="357" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow2)"/>
  
  <rect x="340" y="340" width="80" height="35" rx="5" fill="#2d3748" stroke="#4a5568"/>
  <text x="380" y="362" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Response</text>
  
  <!-- Loop arrow for tool calls -->
  <path d="M 275 340 Q 275 310 275 340" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <ellipse cx="275" cy="320" rx="30" ry="15" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="275" y="305" text-anchor="middle" fill="#f59e0b" font-family="Arial, sans-serif" font-size="8">Tool Loop</text>
  
  <!-- LangChain Code Example -->
  <rect x="80" y="400" width="340" height="90" rx="8" fill="#1e1e1e" stroke="#3c3c3c"/>
  <text x="95" y="420" fill="#569cd6" font-family="monospace" font-size="10">agent</text>
  <text x="130" y="420" fill="#ffffff" font-family="monospace" font-size="10">= create_agent(</text>
  <text x="105" y="436" fill="#9cdcfe" font-family="monospace" font-size="10">model</text>
  <text x="140" y="436" fill="#ffffff" font-family="monospace" font-size="10">=llm,</text>
  <text x="105" y="452" fill="#9cdcfe" font-family="monospace" font-size="10">tools</text>
  <text x="135" y="452" fill="#ffffff" font-family="monospace" font-size="10">=[get_price, forecast],</text>
  <text x="105" y="468" fill="#9cdcfe" font-family="monospace" font-size="10">system_prompt</text>
  <text x="195" y="468" fill="#ce9178" font-family="monospace" font-size="10">="You are..."</text>
  <text x="95" y="484" fill="#ffffff" font-family="monospace" font-size="10">)</text>
  
  <!-- Key Points LangChain -->
  <text x="250" y="515" text-anchor="middle" fill="#22c55e" font-family="Arial, sans-serif" font-size="12" font-weight="bold">✓ Single Agent Architecture</text>
  <text x="250" y="535" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="10">• One LLM handles everything</text>
  <text x="250" y="552" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="10">• Tools defined in one place</text>
  <text x="250" y="569" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="10">• Simple, linear execution</text>
  
  
  <!-- ============ RIGHT SIDE: LangGraph ============ -->
  
  <text x="750" y="75" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="20" font-weight="bold">🔄 LangGraph Multi-Agent</text>
  <text x="750" y="95" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="11">Cyclic Graph with Supervisor (Parallel Flow)</text>
  
  <!-- LangGraph Flow Diagram -->
  
  <!-- Supervisor Node -->
  <rect x="680" y="115" width="140" height="50" rx="10" fill="url(#langgraphGrad)" filter="url(#shadow2)"/>
  <text x="750" y="138" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🎯 Supervisor</text>
  <text x="750" y="155" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="9">Routes to agents</text>
  
  <!-- Arrows from Supervisor -->
  <path d="M 700 165 Q 620 200 600 230" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 750 165 Q 750 200 750 230" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 800 165 Q 880 200 900 230" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  
  <!-- Agent Nodes -->
  <rect x="540" y="235" width="110" height="70" rx="8" fill="#f59e0b" filter="url(#shadow2)"/>
  <text x="595" y="260" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">⚡ Agent 1</text>
  <text x="595" y="278" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="9">LangChain Agent</text>
  <text x="595" y="293" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="8">+ own tools</text>
  
  <rect x="695" y="235" width="110" height="70" rx="8" fill="#3b82f6" filter="url(#shadow2)"/>
  <text x="750" y="260" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🔗 Agent 2</text>
  <text x="750" y="278" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="9">LangChain Agent</text>
  <text x="750" y="293" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="8">+ own tools</text>
  
  <rect x="850" y="235" width="110" height="70" rx="8" fill="#22c55e" filter="url(#shadow2)"/>
  <text x="905" y="260" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📦 Agent 3</text>
  <text x="905" y="278" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="9">LangChain Agent</text>
  <text x="905" y="293" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="8">+ own tools</text>
  
  <!-- Parallel execution indicator -->
  <rect x="600" y="215" width="260" height="15" rx="3" fill="rgba(139, 92, 246, 0.3)"/>
  <text x="730" y="226" text-anchor="middle" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="9">⚡ Parallel Execution (Send API)</text>
  
  <!-- Arrows to Final Response -->
  <path d="M 595 305 Q 595 340 680 360" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 750 305 Q 750 340 750 360" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 905 305 Q 905 340 820 360" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  
  <!-- Final Response Node -->
  <rect x="680" y="365" width="140" height="50" rx="10" fill="#ec4899" filter="url(#shadow2)"/>
  <text x="750" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">📝 Final Response</text>
  <text x="750" y="405" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="9">Synthesize results</text>
  
  <!-- StateGraph Label -->
  <rect x="530" y="320" width="90" height="25" rx="5" fill="#2d3748" stroke="#8b5cf6"/>
  <text x="575" y="337" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="9">StateGraph</text>
  
  <!-- Cyclic arrow -->
  <path d="M 820 140 Q 920 140 920 270 Q 920 350 820 365" stroke="#8b5cf6" stroke-width="2" fill="none" stroke-dasharray="5,3"/>
  <text x="940" y="255" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="9" transform="rotate(90, 940, 255)">Cyclic</text>
  
  <!-- LangGraph Code Example -->
  <rect x="530" y="430" width="440" height="75" rx="8" fill="#1e1e1e" stroke="#3c3c3c"/>
  <text x="545" y="448" fill="#569cd6" font-family="monospace" font-size="10">graph</text>
  <text x="580" y="448" fill="#ffffff" font-family="monospace" font-size="10">= StateGraph(AgentState)</text>
  <text x="545" y="464" fill="#ffffff" font-family="monospace" font-size="10">graph.add_node(</text>
  <text x="660" y="464" fill="#ce9178" font-family="monospace" font-size="10">"supervisor"</text>
  <text x="755" y="464" fill="#ffffff" font-family="monospace" font-size="10">, supervisor_fn)</text>
  <text x="545" y="480" fill="#ffffff" font-family="monospace" font-size="10">graph.add_conditional_edges(</text>
  <text x="760" y="480" fill="#ce9178" font-family="monospace" font-size="10">"supervisor"</text>
  <text x="845" y="480" fill="#ffffff" font-family="monospace" font-size="10">, route)</text>
  <text x="545" y="496" fill="#dcdcaa" font-family="monospace" font-size="10"># Returns [Send("agent1"), Send("agent2")]</text>
  
  <!-- Key Points LangGraph -->
  <text x="750" y="530" text-anchor="middle" fill="#8b5cf6" font-family="Arial, sans-serif" font-size="12" font-weight="bold">✓ Multi-Agent Orchestration</text>
  <text x="750" y="550" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="10">• Supervisor routes to specialists</text>
  <text x="750" y="567" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="10">• Each agent = LangChain Agent with tools</text>
  <text x="750" y="584" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="10">• Parallel execution, cyclic flows</text>
  
</svg>

<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="supervisorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea" />
      <stop offset="100%" style="stop-color:#764ba2" />
    </linearGradient>
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb" />
      <stop offset="100%" style="stop-color:#f5576c" />
    </linearGradient>
    <linearGradient id="kgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe" />
      <stop offset="100%" style="stop-color:#00f2fe" />
    </linearGradient>
    <linearGradient id="orderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b" />
      <stop offset="100%" style="stop-color:#38f9d7" />
    </linearGradient>
    <linearGradient id="unknownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a" />
      <stop offset="100%" style="stop-color:#fee140" />
    </linearGradient>
    <linearGradient id="finalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea" />
      <stop offset="100%" style="stop-color:#fed6e3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Multi-Agent System Architecture</text>
  <text x="450" y="55" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="12">LangGraph + AWS Bedrock + Neo4j Knowledge Graph</text>
  
  <!-- User Input Box -->
  <rect x="350" y="75" width="200" height="50" rx="25" fill="#2d3748" stroke="#4a5568" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="100" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14">👤 User Query</text>
  <text x="450" y="115" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="10">"What's the ERCOT price?"</text>
  
  <!-- Arrow from User to Supervisor -->
  <line x1="450" y1="125" x2="450" y2="155" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Supervisor Box -->
  <rect x="300" y="160" width="300" height="80" rx="10" fill="url(#supervisorGrad)" filter="url(#shadow)"/>
  <text x="450" y="190" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🎯 SUPERVISOR</text>
  <text x="450" y="210" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11">Analyzes query → Routes to specialist agent(s)</text>
  <text x="450" y="228" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10">Claude Haiku + Structured Output</text>
  
  <!-- Routing Decision Label -->
  <text x="450" y="260" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="11" font-style="italic">Routing Decision (can select multiple agents)</text>
  
  <!-- Arrows from Supervisor to Agents -->
  <path d="M 350 240 Q 200 280 150 320" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 400 240 Q 350 280 350 320" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 500 240 Q 550 280 550 320" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 550 240 Q 700 280 750 320" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Agent Boxes Row -->
  
  <!-- Energy Agent -->
  <rect x="50" y="325" width="180" height="120" rx="10" fill="url(#energyGrad)" filter="url(#shadow)"/>
  <text x="140" y="355" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">⚡ Energy Agent</text>
  <text x="140" y="375" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Prices &amp; Forecasts</text>
  <rect x="60" y="385" width="160" height="50" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="140" y="402" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">🔧 get_energy_price()</text>
  <text x="140" y="418" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9">🔧 get_market_forecast()</text>
  
  <!-- Knowledge Graph Agent -->
  <rect x="260" y="325" width="180" height="120" rx="10" fill="url(#kgGrad)" filter="url(#shadow)"/>
  <text x="350" y="355" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">🔗 KG Agent</text>
  <text x="350" y="375" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="10">Neo4j Knowledge Graph</text>
  <rect x="270" y="385" width="160" height="50" rx="5" fill="rgba(0,0,0,0.15)"/>
  <text x="350" y="402" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="9">🔧 kg_list_markets()</text>
  <text x="350" y="418" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="9">🔧 kg_fetch_power_plants()</text>
  
  <!-- Order Agent -->
  <rect x="470" y="325" width="180" height="120" rx="10" fill="url(#orderGrad)" filter="url(#shadow)"/>
  <text x="560" y="355" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">📦 Order Agent</text>
  <text x="560" y="375" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="10">Tracking &amp; Status</text>
  <rect x="480" y="385" width="160" height="50" rx="5" fill="rgba(0,0,0,0.15)"/>
  <text x="560" y="402" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="9">🔧 get_order_status()</text>
  <text x="560" y="418" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="9">🔧 track_shipment()</text>
  
  <!-- Unknown Agent -->
  <rect x="680" y="325" width="180" height="120" rx="10" fill="url(#unknownGrad)" filter="url(#shadow)"/>
  <text x="770" y="355" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">❓ Unknown Agent</text>
  <text x="770" y="375" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="10">Out-of-scope queries</text>
  <rect x="690" y="385" width="160" height="50" rx="5" fill="rgba(0,0,0,0.15)"/>
  <text x="770" y="405" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="9">Returns helpful message</text>
  <text x="770" y="420" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="9">about capabilities</text>
  
  <!-- Arrows from Agents to Results Aggregation -->
  <path d="M 140 445 Q 140 480 300 500" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 350 445 Q 350 480 380 500" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 560 445 Q 560 480 520 500" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 770 445 Q 770 480 600 500" stroke="#ffffff" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Results Aggregation -->
  <rect x="280" y="505" width="340" height="40" rx="8" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
  <text x="450" y="530" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">📊 Agent Results Aggregated (Parallel Execution)</text>
  
  <!-- Arrow to Final Response -->
  <line x1="450" y1="545" x2="450" y2="570" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Final Response Box -->
  <rect x="300" y="575" width="300" height="60" rx="10" fill="url(#finalGrad)" filter="url(#shadow)"/>
  <text x="450" y="600" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">📝 Final Response</text>
  <text x="450" y="620" text-anchor="middle" fill="#1a1a2e" font-family="Arial, sans-serif" font-size="10">LLM synthesizes results into natural response</text>
  
  <!-- Arrow to User Response -->
  <line x1="450" y1="635" x2="450" y2="660" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- User Response Box -->
  <rect x="350" y="665" width="200" height="30" rx="15" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>
  <text x="450" y="685" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12">✨ Response to User</text>
  
  <!-- Legend -->
  <rect x="20" y="500" width="130" height="100" rx="8" fill="rgba(255,255,255,0.05)" stroke="#4a5568" stroke-width="1"/>
  <text x="85" y="520" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Data Sources</text>
  <circle cx="35" cy="540" r="6" fill="#f5576c"/>
  <text x="50" y="544" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="9">Mock Data</text>
  <circle cx="35" cy="560" r="6" fill="#00f2fe"/>
  <text x="50" y="564" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="9">Neo4j DB</text>
  <circle cx="35" cy="580" r="6" fill="#764ba2"/>
  <text x="50" y="584" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="9">AWS Bedrock</text>
  
  <!-- Parallel Execution Note -->
  <rect x="720" y="470" width="160" height="45" rx="5" fill="rgba(255,255,255,0.05)" stroke="#4a5568" stroke-width="1"/>
  <text x="800" y="488" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="bold">⚡ Parallel Execution</text>
  <text x="800" y="505" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="9">Multiple agents run</text>
  <text x="800" y="518" text-anchor="middle" fill="#a0a0a0" font-family="Arial, sans-serif" font-size="9">simultaneously via Send()</text>
  
</svg>
